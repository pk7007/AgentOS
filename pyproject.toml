[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.2.0"
description = "Local ledger and policy engine for multi-agent coding hosts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agentos = "agentos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentos = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: talks to a real host CLI installed on this machine (opt-in)",
    "session: starts a real model session, which uses the account's quota (needs the owner's go-ahead)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.coverage.run]
source = ["agentos"]
